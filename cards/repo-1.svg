<svg xmlns="http://www.w3.org/2000/svg" width="490" height="170" viewBox="0 0 490 170" role="img" aria-labelledby="t"><title id="t">Fire-Detection: A highly accurate fire detection system deployed in the Tersan shipyard. Utilizing advanced image processing techniques, this system captures real-time footage from cameras and achieves a 97% accuracy rate in detecting fires.</title><style>@font-face{font-family:d;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:b;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:m;src:url(data:font/woff;base64,) format("woff")}
.up{animation:up .8s cubic-bezier(.2,.75,.25,1) backwards}
.fade{animation:fade .7s ease-out backwards}
.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1) backwards;transform-box:fill-box;transform-origin:center}
.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
.growx{animation:growx 1s cubic-bezier(.2,.8,.2,1) backwards;transform-box:fill-box;transform-origin:0 50%}
.draw{stroke-dasharray:1;animation:draw 1.2s cubic-bezier(.6,0,.2,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
.s{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.m{display:none}.s{display:inline}}
