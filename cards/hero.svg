<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t"><title id="t">Muhammet Yusuf Aksu — Building enterprise ERP at Tersan Shipyard with .NET, React and SQL Server, with a soft spot for computer vision and AI.</title><style>@font-face{font-family:d;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:b;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:m;src:url(data:font/woff;base64,) format("woff")}
